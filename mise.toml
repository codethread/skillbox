[tools]
bun = "1.4.2"
node = "24.21.0"

[tasks.bootstrap]
description = "Install repository and Botlake dependencies and activate Git hooks"
alias = "default"
run = [
	"bun install --frozen-lockfile",
	"bun install --cwd .botlake --frozen-lockfile",
	"bun run setup:hooks",
]

[tasks.install]
description = "Build and install the compiled binary to ~/.local/bin"
run = [
	"bun run build:binary",
	'mkdir -p "$HOME/.local/bin"',
	'install -m 755 dist/skillbox "$HOME/.local/bin/skillbox"',
]

[tasks.fmt]
description = "Format repository files"
run = "bun run fmt"

[tasks.check]
description = "Check formatting, lint, types, and black-box tests"
run = "bun run check"
