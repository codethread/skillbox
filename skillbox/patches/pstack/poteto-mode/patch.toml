schema = 1

[files."./SKILL.md"]
intent = "Remove Cursor-only question, plugin-agent, model-slug, authoring, control-skill, and loop assumptions. Keep the principles, autonomy limits, delegation ownership, role diversity, and playbook routing; configured agent context supplies mechanics and useful continuity."

[files."./playbooks/authoring-a-skill.md"]
intent = "Use available project authoring guidance instead of Cursor create-skill; retrieve Skillbox guidance through skills get when relevant. Identify the editable source and owner, distinguishing owned skills, optional complementary local skills, consumer patches of adapted imports, and shared maintainer changes. Native imports use owned source or an owner handoff. Preserve voice, validation, structural testing, and PR steps without requiring producer checkout access."

[files."./playbooks/autonomous-run.md"]
intent = "Replace Cursor /loop with event reporting and bounded active waits, explicitly distinguishing them from persistent scheduling and progress. Preserve the exit predicate, iteration evidence, side-fix autonomy, and dead-end rule."

[files."./playbooks/autopilot-full.md"]
intent = "Use isolated agents and durable task notes instead of cloud VMs and a system-prompt agent store. Replace unavailable deslop/control plugins and /loop while retaining owner lifecycle, independent swarm evidence, merge authorization, and side-effect-based stall detection without concurrent replacement writers."

[files."./playbooks/babysit.md"]
intent = "Remove the Cursor built-in collision warning and /loop dependency. Keep the supplied forge watcher, request modes, frontier discipline, skeptical triage, and merge-ready stopping conditions."

[files."./playbooks/bug-fix.md"]
intent = "Remove the fixed Cursor implementation model and loop command; use configured delegation and the project verification driver while preserving self-reproduction, mechanism proof, minimal fixes, and red-first history."

[files."./playbooks/eval.md"]
intent = "Use task-scoped activity records or harness transcripts instead of Cursor's transcript directory, and defer agent selection to the hub. Preserve model diversity, blinded judging, organic prompts, and evidence of actual file reads rather than self-report."

[files."./playbooks/feature.md"]
intent = "Remove the fixed feature model and Cursor speed settings while retaining mandatory delegation, precise scope/data-shape criteria, arena alternatives, review separation, and the throughput checkpoint."

[files."./playbooks/hillclimb.md"]
intent = "Replace fixed model/speed settings with configured agent selection; retain isolated parallel hypotheses, frozen measurement, per-attempt regression gates, and keep-or-revert discipline."

[files."./playbooks/multi-phase-plan.md"]
intent = "Use installed skill paths, project plan locations, configured verification agents, available surface drivers, and an active hourly audit policy instead of Cursor plugin paths, cloud defaults, and /loop. Preserve the checklist skeleton, ten live lanes, perf gates, operator review, evidence requirements, and explicit execution go."

[files."./playbooks/opening-a-pr.md"]
intent = "Replace Task-specific worktree inheritance/reset assumptions with separate concurrent writers and reviewed handoffs. Replace unavailable deslop with the existing Comments/unslop guidance while retaining forge operations, PR structure, stacking, and babysit timing."

[files."./playbooks/orchestrate.md"]
intent = "Replace Task, Project-store, cloud-VM, and runtime-control assumptions with delegated workers, shared task records, isolated writers, and available verification surfaces. Allow direct coordination and useful continuity while preserving owner/verifier separation, bounded topology, supervision, and retry policy."

[files."./playbooks/perf-issue.md"]
intent = "Use available verification drivers and configured agents instead of Cursor control skills and hard-coded model/speed settings; preserve baseline vetting, mantra order, trace comparison, and measured claims."

[files."./playbooks/prototype.md"]
intent = "Use the project's verification skill or named driver rather than an unavailable control skill; preserve throwaway scope, alternative exploration, direct observation, and the handoff to real implementation."

[files."./playbooks/refactoring.md"]
intent = "Remove fixed model/speed settings and the external control-skill dependency; preserve contract pinning, small behavior-preserving steps, caller migration, and real-artifact equivalence proof."

[files."./playbooks/runtime-forensics.md"]
intent = "Use available verification drivers and configured parsing delegates instead of Cursor control/model assumptions, retaining live instrumentation, reduced artifact findings, mechanism proof, and diagnosis-only scope."

[files."./playbooks/session-pickup.md"]
intent = "Find the prior trail through task/agent records, scoped harness transcripts, or a pushed branch rather than Cursor history paths and cloud URLs; preserve reconstruction, avoiding repeated work, and verifying inherited claims."

[files."./playbooks/shipping.md"]
intent = "Replace Cursor cloud verifiers/control plugins with isolated independent agents and available drivers, and rearm the supplied watcher without /loop. Preserve per-PR verdicts, patch-id validity, bottom-up landing, and the verified ceiling."

[files."./playbooks/trace-forensics.md"]
intent = "Defer parsing-agent selection to configured context instead of Cursor reasoning/speed settings, leaving the fixed-dataset query, attribution, paired-capture, and diagnosis-only method intact."

[files."./playbooks/visual-parity.md"]
intent = "Use an available verification driver and ordinary repeated comparisons instead of a Cursor control skill and /loop; preserve baseline immutability, component isolation, and zero-diff completion."

[files."./playbooks/worktree-cleanup.md"]
intent = "Retain the upstream audit lever, but require live agent/process/pin checks instead of Cursor chat/sidebar evidence. Align verify-usage rows with the adapted helper, preserve authorization for untracked data, and defer removal to the project's worktree tooling instead of force-removal commands. Remove Cursor-specific cache advice while preserving cleanup gates and reporting."

[files."./references/poteto-agent.md"]
intent = "Carry the upstream plugin agent's mandatory full-skill/principle reading contract as a portable delegate brief because plugin agents are not installed as skills. Pin its upstream source for update review and use a resolvable skill-relative path without Cursor plugin discovery."

[files."./scripts/check-plan.mjs"]
intent = "Change only program-location/audit markers and verification-agent diagnostic text to match the adapted plan; preserve all structural, ten-lane, evidence, and prose checks."

[files."./scripts/check-plan.test.ts"]
intent = "Align only the valid fixture's location/audit markers and example agent label with the adapted plan contract, preserving upstream checker test coverage."

[files."./scripts/worktree-audit.sh"]
intent = "Preserve the executable git/size/age/dirty/PR audit while removing Cursor transcript lookup and LAST_CHAT output. Otherwise eligible trees become verify-usage candidates, never safe based on absent chat evidence; the playbook supplies live usage checks."

