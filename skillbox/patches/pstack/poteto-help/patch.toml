intent = "Route user questions to the canonical bundled guide, relevant skills, and prompt-first next actions. Keep setup tied to Botlake configuration and Skillbox guidance, preserve engineering and verification advice, and direct customization to owned sources or consumer patches without adding a second operations manual."

