[files."./references/guide/01-setup.md"]
intent = "Remove the retired setup-pstack workflow and its remaining agent-choice prerequisite because Botlake already owns agent configuration. Installation can lead directly to a first task using existing defaults. Keep configuration help conditional, task-specific choices in prompts, required independence and model diversity, and scoped approval before persistent shared changes. Preserve both optional once-per-chat verification offers, prompt-first acceptance, real evidence and formal bounds, consuming-project source ownership, and creator and maintainer links. Do not restore a role interview or substitute setup skill."

[files."./references/guide/02-poteto-mode.md"]
intent = "Remove the unsupported promise that a new-task phrase resets playbook routing. A changed goal and its constraints determine the task. Keep ordinary-language examples, read-only requests, context-aware follow-ups, and reloading the skill when needed without introducing another control token."

[files."./references/guide/03-understand.md"]
intent = "Guide users through `/how`, `/why`, `/teach`, and `/recall` for code behavior, rationale, and recent context. Require available evidence sources, citations, bounded searches, and explicit gaps when evidence cannot be accessed."

[files."./references/guide/04-design.md"]
intent = "Remove the setup-pstack panel-configuration caller because Botlake's catalog and project configuration already own available agents. Keep panel adjustments in the actual task prompt and preserve Arena's model diversity, independent judging rules, and protected skill routes. Do not recreate a shared stack role map."

[files."./references/guide/05-build-and-clean.md"]
intent = "Show how to prompt build playbooks from observed symptoms and clean a diff with independent comment and prose review. Preserve reproduction-first debugging, behavior checks, Comment Sicko's comment-only scope, and no unverified cleanup claims."

[files."./references/guide/06-verify-and-ship.md"]
intent = "Remove the unsolicited daily scheduled-maintenance prescription because the verification creator permits cadence suggestions only on request. Keep the maintainer, every-feature source and live coverage, evidence and regression reporting, and all verification creator and maintainer links. Do not restore a standing schedule through onboarding guidance."

[files."./references/guide/07-overnight.md"]
intent = "Define safe unattended work through a checkable exit condition, isolated writers, Botlake task and context records, decision trails, bounded active waits, and morning audit. Do not imply that task status, timeouts, or a stopped coordinator schedules or proves progress."

[files."./references/guide/08-principles.md"]
intent = "Teach users to steer work by naming the stack's principles while agents read and apply the full leaf skills. Preserve each principle's engineering meaning, trigger, and requirement to report the decision it changed."

[files."./references/guide/09-make-it-yours.md"]
intent = "Remove the implication that customizable model roles form a stack-specific configuration subsystem. Keep optional personal styles, the playbooks and routing, consuming-project source ownership, consumer-owned patches and shared-maintainer boundaries, verification creators and maintainers, and existing workflow responsibilities and protected routes."

[files."./references/guide/10-recipes-and-pitfalls.md"]
intent = "Remove the obsolete stack-role reference left by setup-pstack retirement. Keep the unavailable-model advice bound to Botlake's catalog and the setup page's conditional agent help. Do not restore a role map or change protected skill links or routes."

[files."./references/guide/README.md"]
intent = "Remove compulsory agent review from the onboarding summary because existing Botlake configuration is ready to use. Keep the guide's installation-to-first-task route and all existing navigation targets, including protected skills and verification guidance."

[files."./references/licenses/ATTRIBUTION.md"]
intent = "Record the canonical guide's derivation, copyright holder, pinned source revision, and MIT license. Keep attribution and the license link intact so redistribution remains traceable and compliant."

[files."./references/licenses/LICENSE"]
intent = "Carry the canonical guide's MIT license text and copyright notice unchanged. This file must preserve the legal terms required for copying, modification, and redistribution."

