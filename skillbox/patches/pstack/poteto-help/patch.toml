[files."./references/guide/01-setup.md"]
intent = "Teach installation through the project's Skillbox configuration, selection of supported Botlake agents and reasoning budgets, validation, cost choices, optional verification setup, and a first task. Do not create a parallel roster or hardcode unsupported models."

[files."./references/guide/02-poteto-mode.md"]
intent = "Explain how `/poteto-mode` routes a goal into a playbook, Botlake context group, delegated lane tasks, and evidence. Preserve prompt guidance, autonomy limits, worktree and app isolation, and the distinction between task tracking and proof of execution."

[files."./references/guide/03-understand.md"]
intent = "Guide users through `/how`, `/why`, `/teach`, and `/recall` for code behavior, rationale, and recent context. Require available evidence sources, citations, bounded searches, and explicit gaps when evidence cannot be accessed."

[files."./references/guide/04-design.md"]
intent = "Guide design through independent architecture proposals, arena competition, adversarial review, swarm coverage, and prototypes before planning. Preserve model diversity, isolated candidates, independent judging, and the distinction between coverage and competing designs."

[files."./references/guide/05-build-and-clean.md"]
intent = "Show how to prompt build playbooks from observed symptoms and clean a diff with independent comment and prose review. Preserve reproduction-first debugging, behavior checks, Comment Sicko's comment-only scope, and no unverified cleanup claims."

[files."./references/guide/06-verify-and-ship.md"]
intent = "Require proof against the real user-facing artifact before shipping. Cover finish conditions, benchmark scrutiny, project-owned verification skills and feature maps, formal verification, independent review, CI, and safe PR landing without broadening maintenance scope."

[files."./references/guide/07-overnight.md"]
intent = "Define safe unattended work through a checkable exit condition, isolated writers, Botlake task and context records, decision trails, bounded active waits, and morning audit. Do not imply that task status, timeouts, or a stopped coordinator schedules or proves progress."

[files."./references/guide/08-principles.md"]
intent = "Teach users to steer work by naming the stack's principles while agents read and apply the full leaf skills. Preserve each principle's engineering meaning, trigger, and requirement to report the decision it changed."

[files."./references/guide/09-make-it-yours.md"]
intent = "Guide personal modes, reflection, project corrections, skill authoring, bot UI actions, and blind evaluation. Keep preferences in owned sources or consumer patches, route shared changes to the owner, and require evidence and approval before edits."

[files."./references/guide/10-recipes-and-pitfalls.md"]
intent = "Provide copyable prompts and cautions for understanding, design, implementation, verification, unattended runs, and parallel work. Keep Botlake operations direct, finish conditions checkable, writers isolated, and agent selection grounded in the configured catalog."

[files."./references/guide/README.md"]
intent = "Index the canonical pstack guide in learning order and direct users from setup through routing, understanding, design, build, verification, unattended work, principles, customization, and recipes. Keep links local and make `/poteto-help` the entry point for questions."

[files."./references/licenses/ATTRIBUTION.md"]
intent = "Record the canonical guide's derivation, copyright holder, pinned source revision, and MIT license. Keep attribution and the license link intact so redistribution remains traceable and compliant."

[files."./references/licenses/LICENSE"]
intent = "Carry the canonical guide's MIT license text and copyright notice unchanged. This file must preserve the legal terms required for copying, modification, and redistribution."

