schema = 1

[files."./SKILL.md"]
intent = "Retire setup-pstack callers without recreating its unused role map or mandatory agent-selection interview. Route configuration questions directly to Botlake only when needed, keep existing defaults ready to use, preserve task-specific choices and required independence and model diversity, and require scoped approval before persistent shared configuration changes. Remove the compulsory category menu because the user's question already determines help routing. Route changed goals by expressed intent, not a magic reset phrase. Distinguish one status report from an explicit babysit request without a named control-mode layer. Keep prompt-first help, once-per-chat optional offers for both verification creators, their evidence requirements, consuming-project source ownership, and all creator and maintainer links. Do not add an alias, stub, replacement manual, or configuration layer."

[files."./references/prompting.md"]
intent = "Remove the unsupported rule that changing tasks requires a special phrase or otherwise continues the prior playbook. Keep concise context-aware follow-ups and explicit changed goals and constraints. Do not replace the phrase with another token or reset mechanism."

[files."./references/recipes.md"]
intent = "Remove the Cursor /loop command from the away recipe; keep the same goal, proof predicate, worktree, decision log, permissions, and dead-end exit."

[files."./references/upstream/ATTRIBUTION.md"]
intent = "Remove the obsolete duplicate attribution path because the canonical legal record now lives at `references/licenses/ATTRIBUTION.md`. Preserve the same pinned source provenance and license information only in that canonical location."

[files."./references/upstream/LICENSE"]
intent = "Remove the obsolete duplicate license path because the canonical MIT license now lives at `references/licenses/LICENSE`. Keep the legal text unchanged in the canonical location and avoid two copies that can drift."

