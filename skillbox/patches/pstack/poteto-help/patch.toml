schema = 1

[files."./SKILL.md"]
intent = "Keep the help router, prompt-first handoff, skill map, and engineering advice. Route setup through existing agent configuration and installation/authoring through Skillbox's on-demand guidance; replace unavailable Cursor modes, hosted agents, loop, and bot UI claims, and link carried guide pages without a second runtime manual. Route personal preferences to owned source or consumer patches of adapted bundles and distinguish shared maintainer changes without requiring a producer checkout."

[files."./references/prompting.md"]
intent = "Replace the Cursor /loop handoff with the Autonomous run playbook while preserving checkable finish conditions, isolation, decision logging, and the escape hatch in away prompts."

[files."./references/recipes.md"]
intent = "Remove the Cursor /loop command from the away recipe; keep the same goal, proof predicate, worktree, decision log, permissions, and dead-end exit."

[files."./references/upstream/ATTRIBUTION.md"]
intent = "Record the carried guide's repository, pinned commit and subtree identities, MIT license, and adaptation scope so copied documentation remains traceable outside the upstream tree. Align the source URL with the recorded pinned revision."

[files."./references/upstream/LICENSE"]
intent = "Carry the upstream MIT license unchanged with the copied guide pages to preserve their attribution and redistribution terms."

[files."./references/upstream/guide/01-setup.md"]
intent = "Carry the setup walkthrough using Skillbox installation guidance and the existing configured roster. Preserve budget choice, verification offers, cost advice, and the first-task prompt without Cursor model-rule files, parent-model aliases, or Custom Mode activation."

[files."./references/upstream/guide/02-poteto-mode.md"]
intent = "Carry the task-routing guide and repair links for the installed tree. Replace Custom Mode persistence and hosted-VM instructions with explicit task invocation and worktree/app-instance isolation, without claiming worktrees isolate machine resources."

[files."./references/upstream/guide/03-understand.md"]
intent = "Carry the investigation guide with installed-tree links and evidence-tool discovery rather than an MCP-only assumption; preserve its code/history/recent-context workflows and evidence standards."

[files."./references/upstream/guide/04-design.md"]
intent = "Carry the design guide with installed-tree links and panels drawn from existing configured agents instead of a separate setup-generated mapping. Preserve prototypes, independent judging, coverage versus competition, and design-before-plan guidance."

[files."./references/upstream/guide/05-build-and-clean.md"]
intent = "Carry the build/cleanup guide with installed-tree links and the carried Comment Sicko brief. Describe its comment-only editing scope consistently with the executable workflow. Request the original code-cleanup outcome without the external Cursor /deslop plugin, retaining independent review and prose cleanup."

[files."./references/upstream/guide/06-verify-and-ship.md"]
intent = "Carry the verification/shipping guide with installed-tree links and project-owned verification skill sources rather than .cursor/skills. Keep the behavior-proof, feature map, formal verification, benchmarking, and shipping requirements. Align maintenance scope with the required patch/tracking artifacts while excluding unrelated skill or product edits."

[files."./references/upstream/guide/07-overnight.md"]
intent = "Carry the overnight guide's finish condition, trust prerequisites, audit trail, and program-coordination workflows. Replace Cursor /loop and cloud Projects with active-run semantics, isolated worktrees, and durable context; distinguish configured scheduling from active waiting and link the unsupported upstream automation pack as background rather than runnable setup."

[files."./references/upstream/guide/08-principles.md"]
intent = "Carry the upstream principles guide with links relocated into the installed skill tree, preserving its engineering vocabulary and descriptions unchanged."

[files."./references/upstream/guide/09-make-it-yours.md"]
intent = "Carry the customization guide with installed-tree links. Use available session history, project skill sources, and on-demand authoring guidance instead of Cursor transcripts/create-skill paths; align bot UI guidance with server-side configured-agent actions while preserving personal-mode, reflection, correction, and blind-eval workflows. Distinguish owned local skills, optional overlays, consumer patches of adapted bundles, and shared maintainer changes. Native imports use owned source or an owner handoff; never require personal preferences to alter the producer's pack."

[files."./references/upstream/guide/10-recipes-and-pitfalls.md"]
intent = "Carry the recipes and pitfalls with installed-tree links. Replace /loop, cloud-agent, and Cursor model-alias assumptions with checkable active runs, worktree isolation, and available configured agents while preserving the original prompt recipes and engineering cautions."

[files."./references/upstream/guide/README.md"]
intent = "Carry the guide index with installed-tree links, describing configured agent choices and coordination rather than Cursor installation, Projects, or a parallel role table; retain the guide's learning path and help entry point."

